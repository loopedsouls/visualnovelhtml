<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Novel Scene</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #f5e6d3, #e8d5c4);
        }

        .game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><defs><linearGradient id="roomGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:%23f0e6d6"/><stop offset="100%" style="stop-color:%23d4c4b0"/></linearGradient></defs><rect width="1200" height="800" fill="url(%23roomGrad)"/></svg>') center/cover;
        }

        .room-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e8d5c4 0%, #d4c4b0 50%, #c4b49f 100%);
        }

        .bookshelf {
            position: absolute;
            left: 0;
            top: 0;
            width: 280px;
            height: 100%;
            background: linear-gradient(to right, #8b7355, #a0896b);
            box-shadow: inset -20px 0 40px rgba(0,0,0,0.3);
        }

        .shelf {
            position: absolute;
            width: 260px;
            height: 60px;
            background: linear-gradient(to bottom, #6d5a44, #5a4938);
            left: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .shelf:nth-child(1) { top: 80px; }
        .shelf:nth-child(2) { top: 180px; }
        .shelf:nth-child(3) { top: 280px; }
        .shelf:nth-child(4) { top: 380px; }
        .shelf:nth-child(5) { top: 480px; }

        .books {
            position: absolute;
            top: -40px;
            left: 10px;
            width: 240px;
            height: 35px;
        }

        .book {
            display: inline-block;
            width: 12px;
            height: 35px;
            margin-right: 2px;
            border-radius: 1px;
        }

        .book:nth-child(odd) { background: linear-gradient(to bottom, #4a90e2, #357abd); }
        .book:nth-child(even) { background: linear-gradient(to bottom, #7ed321, #5ba517); }
        .book:nth-child(3n) { background: linear-gradient(to bottom, #f5a623, #e6941a); }

        .character {
            position: absolute;
            right: 100px;
            top: 50px;
            width: 400px;
            height: 600px;
            z-index: 10;
            animation: fadeIn 1s ease-in;
        }

        .character-body {
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.1) 0%, transparent 70%);
            position: relative;
        }

        .character-head {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 240px;
            background: linear-gradient(145deg, #ffeaa7, #fdcb6e);
            border-radius: 50% 50% 45% 45%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .hair {
            position: absolute;
            top: -20px;
            left: -20px;
            width: 240px;
            height: 200px;
            background: linear-gradient(135deg, #fd79a8, #e84393, #a29bfe);
            border-radius: 50% 50% 40% 40%;
            z-index: -1;
        }

        .hair-strand {
            position: absolute;
            width: 30px;
            height: 80px;
            background: linear-gradient(135deg, #fd79a8, #e84393);
            border-radius: 50% 50% 20% 20%;
            transform-origin: top;
        }

        .hair-strand:nth-child(1) {
            top: 40px;
            right: -15px;
            transform: rotate(25deg);
            animation: hairSway 3s ease-in-out infinite;
        }

        .hair-strand:nth-child(2) {
            top: 60px;
            right: -10px;
            transform: rotate(15deg);
            animation: hairSway 3s ease-in-out infinite 0.5s;
        }

        .eyes {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 40px;
        }

        .eye {
            position: absolute;
            width: 35px;
            height: 35px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #e17055, #6c5ce7);
            border-radius: 50%;
            animation: eyeBlink 4s infinite;
        }

        .eye:nth-child(1) { left: 15px; }
        .eye:nth-child(2) { right: 15px; }

        .pupil {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 18px;
            height: 18px;
            background: radial-gradient(circle at 40% 30%, #74b9ff, #0984e3, #2d3436);
            border-radius: 50%;
        }

        .mouth {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 15px;
            background: linear-gradient(to bottom, #e17055, #d63031);
            border-radius: 0 0 50% 50%;
        }

        .school-uniform {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 320px;
            background: linear-gradient(to bottom, #636e72, #2d3436);
            border-radius: 20px 20px 0 0;
        }

        .collar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 60px;
            background: linear-gradient(to bottom, #ffffff, #ddd);
            border-radius: 50% 50% 20% 20%;
        }

        .tie {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 80px;
            background: linear-gradient(45deg, #e17055, #d63031);
            clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
        }

        .dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 900px;
            background: linear-gradient(135deg, rgba(253, 121, 168, 0.95), rgba(232, 67, 147, 0.95));
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            z-index: 20;
            animation: slideUp 0.8s ease-out;
        }

        .character-name {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            color: white;
            padding: 8px 20px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 18px;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(232, 67, 147, 0.4);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .dialogue-text {
            font-size: 22px;
            color: white;
            line-height: 1.4;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
            font-weight: 500;
        }

        .controls {
            position: absolute;
            bottom: 10px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 25;
        }

        .control-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        @keyframes hairSway {
            0%, 100% { transform: rotate(25deg); }
            50% { transform: rotate(30deg); }
        }

        @keyframes eyeBlink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 200px;
            background: linear-gradient(to bottom, 
                rgba(139, 115, 85, 0.3) 0%,
                rgba(139, 115, 85, 0.5) 50%,
                rgba(90, 73, 56, 0.8) 100%);
            background-image: 
                repeating-linear-gradient(90deg,
                    transparent 0px,
                    rgba(0,0,0,0.1) 1px,
                    transparent 2px,
                    transparent 60px),
                repeating-linear-gradient(0deg,
                    transparent 0px,
                    rgba(0,0,0,0.1) 1px,
                    transparent 2px,
                    transparent 60px);
        }
    </style>
</head>

    <script>
        const dialogues = [
            "Like I could ever get my friends to read this...",
            "I mean, it's not like anyone would understand it anyway.",
            "But... maybe if I explain it right...",
            "No, that's stupid. They'd just make fun of me.",
            "Why do I even care what they think?"
        ];

        let currentDialogue = 0;
        let autoMode = false;
        let autoInterval;

        function nextDialogue() {
            if (currentDialogue < dialogues.length - 1) {
                currentDialogue++;
                document.getElementById('dialogue').textContent = `"${dialogues[currentDialogue]}"`;
                
                // Add typing effect
                const dialogueElement = document.getElementById('dialogue');
                const text = dialogueElement.textContent;
                dialogueElement.textContent = '';
                
                let i = 0;
                const typeInterval = setInterval(() => {
                    dialogueElement.textContent += text[i];
                    i++;
                    if (i >= text.length) {
                        clearInterval(typeInterval);
                    }
                }, 30);
            }
        }

        function previousDialogue() {
            if (currentDialogue > 0) {
                currentDialogue--;
                document.getElementById('dialogue').textContent = `"${dialogues[currentDialogue]}"`;
            }
        }

        function skipDialogue() {
            currentDialogue = dialogues.length - 1;
            document.getElementById('dialogue').textContent = `"${dialogues[currentDialogue]}"`;
        }

        function toggleAuto() {
            autoMode = !autoMode;
            const btn = event.target;
            
            if (autoMode) {
                btn.style.background = 'rgba(255,255,255,0.4)';
                btn.textContent = 'Auto ✓';
                autoInterval = setInterval(() => {
                    if (currentDialogue < dialogues.length - 1) {
                        nextDialogue();
                    } else {
                        toggleAuto();
                    }
                }, 3000);
            } else {
                btn.style.background = 'rgba(255,255,255,0.2)';
                btn.textContent = 'Auto';
                clearInterval(autoInterval);
            }
        }

        function saveGame() {
            const gameState = {
                currentDialogue: currentDialogue,
                timestamp: new Date().toLocaleString()
            };
            // In a real implementation, this would save to a server or local storage
            alert(`Game saved! Current dialogue: ${currentDialogue + 1}/${dialogues.length}`);
        }

        function loadGame() {
            // In a real implementation, this would load from saved data
            alert('Load game functionality would be implemented here.');
        }

        function openSettings() {
            alert('Settings panel would open here with options for text speed, volume, etc.');
        }

        // Click to advance dialogue
        document.addEventListener('click', (e) => {
            if (!e.target.classList.contains('control-btn')) {
                nextDialogue();
            }
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case ' ':
                case 'Enter':
                    e.preventDefault();
                    nextDialogue();
                    break;
                case 'Escape':
                    openSettings();
                    break;
                case 's':
                    saveGame();
                    break;
                case 'l':
                    loadGame();
                    break;
            }
        });

        // Add some interactive elements
        document.querySelector('.character').addEventListener('click', () => {
            // Character reaction
            document.querySelector('.character').style.transform = 'scale(1.05)';
            setTimeout(() => {
                document.querySelector('.character').style.transform = 'scale(1)';
            }, 200);
        });
    </script>
